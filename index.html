<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>supa в браузере</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#EFEFED">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Sofia+Sans+Condensed:wght@300;400;500&family=Sofia+Sans+Extra+Condensed:wght@800;900&display=swap">
<style>
/* Layout: phone column ≤1023 (макеты 390, до 560 по центру) · десктоп ≥1024: сайдбар 264 + колонка 704 + панель 344 (с 1280) */
:root{
  --bg:#EFEFED; --card:#FFFFFF; --ink:#141414; --ash:#8E8E8C; --ash2:#5E5E5C; --mist:#E9E9E7; --mist2:#F5F5F3; --line:#D6D6D3;
  --pine:#17352A; --on-pine:#FFFFFF; --pill:#141414; --on-pill:#FFFFFF;
  --lemon:#F5D33B; --pink:#F07BC2; --leaf:#4DA15C; --sky:#2F7CF6; --orange:#F74B18; --rose:#F6B3D2; --ice:#A9C8F5;
  --on-color:#141414; --paper-dot:rgba(20,20,20,.13); --dot-off:#E2E2DF;
  --scrim:rgba(20,20,20,.42); --shadow:0 12px 40px rgba(20,20,20,.10); --shadow-s:0 4px 16px rgba(20,20,20,.06);
  --f-body:"Geist","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono","DejaVu Sans Mono",monospace;
  --f-cond:"Sofia Sans Condensed","Roboto Condensed","Arial Narrow","DejaVu Sans Condensed",sans-serif;
  --f-disp:"Sofia Sans Extra Condensed","Sofia Sans Condensed","Arial Narrow","DejaVu Sans Condensed",sans-serif;
  --r-s:14px; --r-m:22px; --r-l:28px; --r-xl:36px;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121211; --card:#1D1D1B; --ink:#F3F1EC; --ash:#9B9A95; --ash2:#C3C2BD; --mist:#2A2A27; --mist2:#242422; --line:#363633;
  --pine:#F5D33B; --on-pine:#141414; --pill:#F3F1EC; --on-pill:#141414; --paper-dot:rgba(243,241,236,.12); --dot-off:#2C2C29;
  --scrim:rgba(0,0,0,.62); --shadow:0 12px 40px rgba(0,0,0,.4); --shadow-s:0 4px 16px rgba(0,0,0,.3); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121211; --card:#1D1D1B; --ink:#F3F1EC; --ash:#9B9A95; --ash2:#C3C2BD; --mist:#2A2A27; --mist2:#242422; --line:#363633;
  --pine:#F5D33B; --on-pine:#141414; --pill:#F3F1EC; --on-pill:#141414; --paper-dot:rgba(243,241,236,.12); --dot-off:#2C2C29;
  --scrim:rgba(0,0,0,.62); --shadow:0 12px 40px rgba(0,0,0,.4); --shadow-s:0 4px 16px rgba(0,0,0,.3); color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:12px}
.mono{font-family:var(--f-mono);font-size:11px;line-height:1.4;letter-spacing:.06em;text-transform:uppercase;color:var(--ash)}
.ash{color:var(--ash)} .tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
#app{min-height:100%}
.shell{min-height:100%;display:flex;justify-content:center}
.side,.panel-col{display:none}
.main{flex:1;min-width:0;display:flex;justify-content:center}
.col{width:100%;max-width:560px;min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding-block:12px 10px;background:linear-gradient(var(--bg) 78%,transparent)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.top .ttl{font-weight:600;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.view{flex:1;display:flex;flex-direction:column;gap:14px;padding-block:4px 20px;min-width:0}
.dock{position:sticky;bottom:0;z-index:15;padding-block:10px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}

/* section switcher (Раздел ▾) */
.nav-pill{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 4px 0 12px;border-radius:20px;background:var(--pill);color:var(--on-pill);font-weight:600;font-size:15px;box-shadow:0 0 0 3px color-mix(in srgb,var(--lemon) 0%,transparent);transition:box-shadow .3s,transform .2s var(--spring);flex:none}
.nav-pill:active{transform:scale(.96)}
.nav-pill .chev{width:32px;height:32px;border-radius:50%;background:var(--on-pill);color:var(--pill);display:grid;place-items:center}
.nav-pill.hint{animation:navHint 2.4s var(--ease) 1.2s 2}
@keyframes navHint{0%,100%{box-shadow:0 0 0 0 transparent}30%{box-shadow:0 0 0 5px var(--lemon)}60%{box-shadow:0 0 0 2px var(--lemon)}}
.dots4{display:grid;grid-template-columns:5px 5px;gap:3px}
.dots4 i{width:5px;height:5px;border-radius:50%}
.back{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 14px 0 10px;border-radius:18px;background:var(--card);font-weight:500;font-size:15px;flex:none;box-shadow:var(--shadow-s)}
.saved{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:15px;background:var(--pill);color:var(--on-pill);font-weight:600;font-size:13px;flex:none}
.saved.bump{animation:bump .5s var(--spring)}
@keyframes bump{40%{transform:scale(1.25)}}
.ava{width:32px;height:32px;border-radius:50%;background:var(--pink);color:var(--on-color);display:grid;place-items:center;font-weight:600;font-size:14px;flex:none}

/* ---------- desktop ---------- */
@media (min-width:1024px){
  .shell{display:grid;grid-template-columns:264px minmax(0,1fr);justify-content:stretch}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;background:var(--card);border-right:1px solid var(--line);padding:28px 20px 24px}
  .col{max-width:none;padding:0 48px}
  .top{padding-block:24px 18px;gap:16px}
  .top .ttl{font-size:28px}
  .page{display:grid;grid-template-columns:minmax(0,704px) 344px;gap:32px;align-items:start;width:100%;max-width:1080px;margin-inline:auto}
  .page.wide{grid-template-columns:minmax(0,1fr)}
  .panel-col{display:flex;flex-direction:column;gap:16px;position:sticky;top:96px}
  .mob{display:none!important}
}
@media (min-width:1024px) and (max-width:1279px){
  .page{grid-template-columns:minmax(0,1fr)}
  .panel-col{position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));align-items:start}
}
@media (max-width:1023px){ .desk{display:none!important} }
.page{width:100%}
.main-col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:1024px){ .main-col{min-height:calc(100vh - 120px)} .main-col>.dock{margin-top:auto} }

/* sidebar */
.brand{display:flex;align-items:center;gap:12px;padding:0 4px;margin-bottom:28px}
.brand .ic{width:40px;height:40px;border-radius:10px;overflow:hidden;flex:none}
.side .lbl{padding:0 8px;margin-bottom:8px}
.snav{display:flex;flex-direction:column;gap:4px}
.snav button{display:flex;align-items:center;gap:12px;padding:11px 12px 11px 14px;border-radius:16px;transition:background .2s}
.snav button:hover{background:var(--mist2)}
.snav button.on{background:var(--bg)}
.snav .d{width:12px;height:12px;border-radius:50%;flex:none}
.snav .tx{flex:1;min-width:0}
.snav b{display:block;font-weight:600;font-size:16px;line-height:1.25}
.snav small{display:block;color:var(--ash);font-size:13px}
.snav .mark{width:4px;height:22px;border-radius:2px;background:var(--ink)}
.newtag{font-family:var(--f-mono);font-size:9px;letter-spacing:.06em;padding:3px 6px;border-radius:6px;background:var(--lemon);color:var(--on-color)}
.side hr{border:0;border-top:1px solid var(--line);margin:12px 8px}
.side .plink{padding:11px 14px;border-radius:16px;color:var(--ash);font-weight:500;font-size:15px;width:100%}
.side .plink.on{background:var(--bg);color:var(--ink)}
.side .plink:hover{color:var(--ink)}
.side .grow{flex:1}
.pluscard{border-radius:24px;padding:16px;background:var(--lemon);color:var(--on-color);display:flex;flex-direction:column;gap:10px}
.pluscard.on{background:var(--bg);color:var(--ink)}
.pluscard p{margin:0;font-size:14px;line-height:1.35}
.me-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:20px;margin-top:12px}
.me-row:hover{background:var(--mist2)}
.statesbtn{margin-top:10px;padding:10px 14px;border:1px dashed var(--line);border-radius:14px;color:var(--ash);font-size:13px;width:100%;text-align:left}
.statesbtn:hover{color:var(--ink);border-color:var(--ash)}

/* ---------- primitives ---------- */
.card{background:var(--card);border-radius:var(--r-l);padding:18px}
.card.pad-l{padding:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:56px;padding:0 24px;border-radius:28px;font-weight:600;font-size:16px;background:var(--pine);color:var(--on-pine);transition:transform .18s var(--spring),filter .2s,opacity .2s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn.full{width:100%}
.btn.sec{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.mist{background:var(--mist);color:var(--ink)}
.btn.dark{background:var(--pill);color:var(--on-pill)}
.btn.lemon{background:var(--lemon);color:var(--on-color)}
.btn.ghost{background:none;color:var(--ash);height:44px}
.btn.danger{color:var(--orange)}
.btn.s{height:40px;padding:0 16px;font-size:14px;border-radius:20px}
.btn.m{height:48px;font-size:15px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:18px;background:var(--card);font-weight:500;font-size:14px;white-space:nowrap;transition:background .2s,transform .2s var(--spring)}
.chip.mist{background:var(--mist)}
.chip.on{background:var(--pill);color:var(--on-pill)}
.chip.out{background:none;box-shadow:inset 0 0 0 1px var(--sky);color:var(--sky)}
.chip .d{width:8px;height:8px;border-radius:50%}
.chip .x{opacity:.6;font-size:12px}
.chip:active{transform:scale(.95)}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:7px;font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#fff;white-space:nowrap}
.tag.ok{background:var(--leaf)} .tag.buy{background:var(--orange)} .tag.no{background:var(--pink);color:var(--on-color)} .tag.sub{background:var(--sky)} .tag.lem{background:var(--lemon);color:var(--on-color)} .tag.gray{background:var(--mist);color:var(--ash2)}
.lnk{color:var(--sky);font-weight:500}
.lnk.red{color:var(--orange)}
.h-disp{font-family:var(--f-disp);font-weight:900;text-transform:uppercase;line-height:.92;letter-spacing:-.005em;text-wrap:balance;margin:0}
.h-cond{font-family:var(--f-cond);font-weight:400;line-height:1.08;margin:0;text-wrap:balance}
.h2{font-weight:600;font-size:20px;line-height:1.25;margin:0}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:6px}
.sect-h h3{margin:0;font-size:19px;font-weight:600}
.sect-h button{color:var(--ash);font-size:14px}
.switch{width:52px;height:32px;border-radius:16px;background:var(--mist);position:relative;flex:none;transition:background .25s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform .3s var(--spring)}
.switch.on{background:var(--pine)}
.switch.on::after{transform:translateX(20px)}
.input{width:100%;height:56px;border-radius:18px;background:var(--mist2);border:1px solid var(--line);padding:0 18px;font-size:17px;outline:none;transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 10%,transparent)}
.input.err{border-color:var(--orange)}
textarea.input{height:auto;min-height:120px;padding:14px 18px;resize:vertical;line-height:1.45}
.err-t{color:var(--orange);font-size:14px}
.note{font-size:13px;color:var(--ash);line-height:1.45;margin:0}
.divline{height:1px;background:var(--line)}

/* ---------- logo ---------- */
.potic{display:block}
.potic .steam{animation:steam 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.potic .steam:nth-of-type(2){animation-delay:.35s}.potic .steam:nth-of-type(3){animation-delay:.7s}
@keyframes steam{0%,100%{transform:translateY(0) scaleY(1);opacity:1}50%{transform:translateY(-6px) scaleY(1.06);opacity:.75}}
.potic .eye{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.wm{display:block}
.wm circle{transform-box:fill-box;transform-origin:center}
.wm.pop circle{animation:dotPop .5s var(--spring) both;animation-delay:calc(var(--k)*18ms + 250ms)}
@keyframes dotPop{from{transform:scale(0);opacity:0}}

/* ---------- splash ---------- */
.splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background-color:var(--bg);background-image:radial-gradient(var(--paper-dot) 1.2px,transparent 1.4px);background-size:20px 20px;transition:opacity .5s,visibility .5s}
.splash.eve{--bg:#121211;--paper-dot:rgba(243,241,236,.12);background-color:#121211;color:#F3F1EC}
.splash.out{opacity:0;visibility:hidden}
.splash .ic{width:148px;height:148px;border-radius:34px;overflow:hidden;animation:icIn .7s var(--spring) both;box-shadow:0 18px 50px rgba(0,0,0,.18)}
@keyframes icIn{from{transform:scale(.6) rotate(-8deg);opacity:0}}
.splash .bar{width:160px;height:4px;border-radius:2px;background:color-mix(in srgb,currentColor 12%,transparent);overflow:hidden}
.splash .bar i{display:block;height:100%;width:100%;background:currentColor;transform-origin:left;animation:load 1.6s var(--ease) both}
@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.splash .eve-chip{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:20px;background:#fff;color:#141414;font-family:var(--f-mono);font-size:12px;letter-spacing:.05em;animation:rise .6s var(--ease) .8s both}
.splash .q{position:absolute;bottom:calc(40px + env(safe-area-inset-bottom,0px))}

/* ---------- appear animations ---------- */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}}
@keyframes sheetUp{from{transform:translateY(100%)}}
@keyframes slideL{from{opacity:0;transform:translateX(24px)}}
.enter [data-s]{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
.msg-new{animation:msgIn .5s var(--ease) both}
@keyframes msgIn{from{opacity:0;transform:translateY(12px) scale(.98)}}
.me-new{animation:meIn .45s var(--spring) both;transform-origin:right bottom}
@keyframes meIn{from{opacity:0;transform:scale(.8)}}

/* ---------- ball ---------- */
.ball{width:56px;height:56px;border-radius:50%;position:relative;overflow:hidden;flex:none;background:#A9D0F5;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 6px 18px rgba(47,124,246,.18);isolation:isolate}
.ball::before{content:"";position:absolute;inset:-35%;background:radial-gradient(circle at 30% 26%,#F5D33B 0 16%,transparent 36%),radial-gradient(circle at 72% 72%,#4DA15C 0 22%,transparent 46%),radial-gradient(circle at 60% 28%,#fff 0 9%,transparent 28%),radial-gradient(circle at 24% 72%,#7FB6F2 0 20%,transparent 48%),#A9D0F5;filter:blur(5px);animation:swirl 10s linear infinite}
.ball.big{width:64px;height:64px}
.ball.l{width:96px;height:96px}
.ball.xl{width:180px;height:180px}
.ball.xl::before{filter:blur(14px)}
.ball.listen{animation:breathe 1.1s ease-in-out infinite}
.ball.listen::before{animation-duration:3s}
@keyframes swirl{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.08)}}

/* ---------- chat ---------- */
.prompt{font-family:var(--f-cond);font-weight:300;font-size:44px;line-height:1.02;color:var(--ash);margin:4px 0 6px;position:relative;cursor:text;text-wrap:balance}
.prompt::before{content:"";position:absolute;left:-6px;top:4px;width:2px;height:44px;background:var(--ink);animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.energy{background:var(--card);border-radius:var(--r-xl);padding:8px 18px}
.energy button{display:flex;align-items:center;gap:16px;width:100%;padding:16px 0;border-bottom:1px solid var(--ink)}
.energy button:last-child{border-bottom:0}
.energy .th{width:62px;height:62px;border-radius:50%;overflow:hidden;flex:none;background:var(--mist)}
.energy .th img{width:100%;height:100%;object-fit:cover;transform:scale(1.5);transition:transform .5s var(--ease)}
.energy button:hover .th img{transform:scale(1.8)}
.energy b{display:block;font-weight:600;font-size:32px;line-height:1.05;letter-spacing:-.01em}
.energy small{display:block;color:var(--ash);font-size:13px;margin-top:2px}
.aicount{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:15px;background:var(--card);font-size:13px;font-weight:500}
.aicount .d{width:8px;height:8px;border-radius:50%;background:var(--lemon)}
.aicount.full .d{background:var(--orange)}
.uq{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.uq .h-cond{font-size:34px}
.bot{background:var(--card);border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;position:relative}
.bot .hd{display:flex;gap:10px;align-items:flex-start}
.bot .av{width:28px;height:28px;border-radius:50%;overflow:hidden;flex:none;margin-top:-2px}
.bot p{margin:0;font-size:16px;line-height:1.4}
.bot .foot{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ash)}
.bot .more{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ash);opacity:0;transition:opacity .2s}
.bot:hover .more{opacity:1}
.me{align-self:flex-end;max-width:80%;background:var(--pill);color:var(--on-pill);border-radius:22px 22px 6px 22px;padding:10px 16px;font-weight:500;font-size:15px}
.typing{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;background:var(--card);border-radius:22px;padding:10px 16px 10px 10px;font-size:14px;color:var(--ash)}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ash);animation:td 1s infinite}
.typing i:nth-child(3){animation-delay:.15s}.typing i:nth-child(4){animation-delay:.3s}
@keyframes td{0%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.skel{background:var(--card);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px}
.sk{border-radius:8px;background:linear-gradient(90deg,var(--mist) 0,var(--mist2) 40%,var(--mist) 80%);background-size:300% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-200% 0}}

.dots{display:flex;justify-content:center;gap:6px}

.clock{--d:clamp(7px,2.5vw,11px);--g:calc(var(--d)*.32);display:grid;grid-template-columns:repeat(25,var(--d));grid-auto-rows:var(--d);gap:var(--g);justify-content:center}

.clock i.sep{visibility:hidden}
.clock.mini{--d:3.6px;--g:1.1px}

.clock.mini i.on{transform:scale(1)}

.cstep{font-size:38px}

/* ---------- toasts ---------- */
function toast(text, o = {}) {
  const box = $('#toasts'), el = document.createElement('div');
  el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = `<span class="d ${o.tone || ''}"></span><span>${text}</span>${o.act ? `<button>${o.act}</button>` : ''}`;
  const hide = () => { el.classList.add('out'); setTimeout(() => el.remove(), 300); };
  if (o.act) el.querySelector('button').onclick = () => { o.fn && o.fn(); hide(); };
  box.appendChild(el); setTimeout(hide, o.ms || 3200);
  while (box.children.length > 2) box.firstChild.remove();
}
function stagger(root) { let i = 0; $$('[data-s]', root).forEach(el => el.style.setProperty('--i', Math.min(i++, 14))); }

/* ---------- add-field: the add button stays disabled until something is typed ---------- */
function addField(id, ph, act, extra = '') {
  return `<form class="addf" data-add="${act}" ${extra} novalidate><label class="sr" for="${id}">${esc(ph)}</label><input class="input s" id="${id}" placeholder="${esc(ph)}" autocomplete="off" maxlength="40"><button class="btn s dark" type="submit" disabled>${I.plusS} ${t('Добавить', 'Add')}</button></form>`;
}
function bindAddForms(root) {
  $$('form.addf', root).forEach(f => {
    if (f._b) return; f._b = 1;
    const inp = f.querySelector('input'), btn = f.querySelector('button');
    const sync = () => { btn.disabled = !inp.value.trim(); };
    inp.addEventListener('input', sync); sync();
    f.addEventListener('submit', e => { e.preventDefault(); const v = inp.value.trim(); if (!v) return; const fn = ADD[f.dataset.add]; inp.value = ''; sync(); if (fn) fn(v, f); const ni = document.getElementById(inp.id); if (ni && document.body.contains(ni) && !ni.closest('.closing')) try { ni.focus({ preventScroll: true }); } catch (x) {} });
  });
}

/* ---------- fridge ---------- */
function crosses() {
  const cols = S.products.filter(k => !k.startsWith('x:')).map(ingColor).concat(['#141414']);
  let h = '', n = 0;
  for (let r = 0; r < 15; r++) for (let c = 0; c < 15; c++) {
    const dx = c - 7, dy = (r - 7) * 1.05, inside = dx * dx + dy * dy <= 52 && !(r < 2 && Math.abs(dx) > 1);
    h += inside ? `<i style="--c:${cols[(r * 7 + c * 3 + (r * c) % 5) % cols.length]};animation-delay:${(n++ % 60) * 12 + r * 18}ms"></i>` : '<i style="visibility:hidden"></i>';
  }
  return `<div class="crosses" aria-hidden="true">${h}</div>`;
}
const lightC = c => { const [r, g, b] = hex(c); return (r * 299 + g * 587 + b * 114) / 1000 > 170; };
function capsule() {
  const pos = ['left:-64px;top:44px', 'right:-58px;top:88px', 'left:-48px;top:168px', 'right:-34px;top:204px'];

  const ready = homeReady(), near = RLIST.filter(r => recipeOK(r) && missing(r).length === 1);

  <div class="cwrap">${crosses()}${lab}</div>

}

function render(anim) {
  const app = $('#app');
  setLangAttr();
  if (R.route === 'public') { app.innerHTML = viewPublic(); post(anim); return; }
  if (R.route === 'onb') { app.innerHTML = onbView(); if (!anim) $$('.enter', app).forEach(e => e.classList.remove('enter')); post(anim); return; }
  let V = (VIEWS[R.route] || VIEWS.chat)();
  if (!online() && !['chat', 'cook', 'done'].includes(R.route)) V = offlineView(V);
  app.innerHTML = shell(V, anim);
  post(anim);
}
function post(anim) {
  stagger($('#app'));
  RT.lastMsgRendered = MID;
  const first = () => {
    $$('[data-clock="r"]').forEach(el => setClock(el, mmss((RECIPES[R.p.id] || RECIPES.shak).time * 60), true));
    $$('[data-clock="spec"]').forEach(el => { const st = RT.cook && RECIPES[RT.cook.rid].steps[RT.cook.step]; if (st && st.tm) setClock(el, mmss(st.tm[0]), true); });
    updateClocks();
  };
  if (anim) requestAnimationFrame(() => requestAnimationFrame(first)); else first();
  bindView(); bindAddForms($('#app'));
  if (R.route === 'done' && anim) confetti();
}

async function cookQuestion(q) {

  const c = RT.cook, r = c && RECIPES[c.rid];

  const recipe = r ? rTitle(r) + '. ' + (en ? 'Ingredients: ' : 'Ингредиенты: ') + r.ing.map(x => ingName(x[0]) + ' ' + tt([x[1], x[2]])).join(', ') + '. ' + (en ? 'Steps: ' : 'Шаги: ') + r.steps.map((s, i) => (i + 1) + ') ' + tt(s.t)).join(' ') : '';
  const step = r && r.steps[c.step] ? tt(r.steps[c.step].t) : '';
  let ans = null;
  try { const [res] = await Promise.all([api('ask', { recipe, step, q }), wait(600)]); ans = res.answer || null; } catch (e) { ans = null; }
  if (!document.body.contains(ov)) return;
  refresh(ov, `<div class="me" style="align-self:flex-end">${esc(q)}</div>` + (ans
    ? `<div class="bot msg-new"><div class="hd">${botAv()}<p>${esc(ans)}</p></div><span class="foot">${t('Ответ ИИ · может ошибаться', 'AI answer · may be wrong')}</span></div>`
    : `<div class="bot msg-new"><div class="hd">${botAv()}<p>${t('Котелок не ответил. Проверь интернет и спроси ещё раз — таймер идёт.', 'Kotelok didn’t answer. Check your connection and ask again. The timer keeps going.')}</p></div></div>`)
    + `<button class="btn full" data-a="ovclose">${t('Понятно', 'Got it')}</button>`);
}
function photoFound(found = PHOTO_FIND, other = []) {
  const before = S.products.length;

    .concat(other.map(n => 'x:' + String(n).trim().toLowerCase()).filter(k => k.length > 3 && !findIng(k.slice(2))));
  keys.forEach(k => { if (!S.products.includes(k)) S.products.push(k); });
  RT.found = keys.length;
  S.photoAt = hhmm(); save();
  go('fridge', { stage: 'found' }, { replace: true });
  if (S.products.length > before) toast(t('Добавил с фото: ', 'Added from photo: ') + (S.products.length - before), { tone: 'g' });
}

    else if (e.key === 'ArrowRight') A.cnext(); else if (e.key === 'ArrowLeft' && RT.cook.step > 0) A.cprev();
    return;
  }
  if (R.route === 'dinners') {
    const list = curList(); if (!list.length) return;
    if (isDesk()) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { RT.sel = (RT.sel + (e.key === 'ArrowRight' ? 1 : -1) + list.length) % list.length; $$('.gcard').forEach((c, i) => c.classList.toggle('sel', i === RT.sel)); e.preventDefault(); }
      else if (e.key === 'Enter') go('recipe', { id: list[RT.sel] });
      else if (e.key === 'Delete' || e.key === 'Backspace') { const c = $$('.gcard')[RT.sel]; if (c) A.skip({ dataset: { id: c.dataset.id } }); }
    } else {
      const car = $('#car'); if (!car) return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const w = car.firstElementChild.offsetWidth + 14; car.scrollBy({ left: e.key === 'ArrowRight' ? w : -w, behavior: 'smooth' }); }
      else if (e.key === 'Enter') A.cookcur();

});
function bindView() {
  const c = $('#comp');
  if (c) {
    const sb = $('[data-a="send"]');
    c.addEventListener('input', () => { sb.disabled = !c.value.trim(); c.style.height = '24px'; c.style.height = Math.min(c.scrollHeight, 72) + 'px'; });
    c.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); A.send(); } });
  }
  const on = $('#oname');
  if (on) { on.addEventListener('input', () => { S.name = on.value.trim(); save(); }); on.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); A.onbnext(); } }); }
  const lim = $('#lim');
  if (lim) {
    lim.addEventListener('input', () => {
      S.lim = +lim.value; const pct = (S.lim - 10) / 80;
      const l = $('.slider .lim'); l.textContent = '≤ ' + S.lim + ' ' + t('мин', 'min'); l.style.left = `calc(16px + (100% - 32px) * ${pct})`;
      $$('.slider .tk i').forEach((x, i) => x.classList.toggle('on', 10 + i * 3 <= S.lim));
    });
    lim.addEventListener('change', () => { save(); RT.carIdx = 0; RT.sel = 0; render(true); toast(t('Пересобрал под ', 'Rebuilt for ') + S.lim + ' ' + t('мин', 'min')); });
  }
  const car = $('#car');
  if (car) {
    const upd = () => {
      const w = car.firstElementChild ? car.firstElementChild.offsetWidth + 14 : 1;
      const i = Math.max(0, Math.min(car.children.length - 1, Math.round(car.scrollLeft / w)));
      if (i !== RT.carIdx || !car.querySelector('.cur')) {
        RT.carIdx = i; [...car.children].forEach((x, k) => x.classList.toggle('cur', k === i)); $$('#cdots i').forEach((x, k) => x.classList.toggle('on', k === i));
        const fc = $('.fav-cur'), id = car.children[i] && car.children[i].dataset.id; if (fc && id) { const s2 = S.saved.includes(id); fc.classList.toggle('on', s2); fc.innerHTML = s2 ? I.heartF : I.heartO; }
      }
    };
    car.addEventListener('scroll', () => requestAnimationFrame(upd), { passive: true });
    if (RT.carIdx) requestAnimationFrame(() => { car.scrollLeft = RT.carIdx * (car.firstElementChild.offsetWidth + 14); });
    $$('.dcard', car).forEach((d, k) => d.addEventListener('click', () => { if (k === RT.carIdx) go('recipe', { id: d.dataset.id }); else car.scrollTo({ left: k * (d.offsetWidth + 14), behavior: 'smooth' }); }));
  }
  $$('.gcard').forEach((g, i) => g.addEventListener('mouseenter', () => { RT.sel = i; $$('.gcard').forEach((x, k) => x.classList.toggle('sel', k === i)); }));
  const ph = $('#photo');
  if (ph) ph.addEventListener('change', () => { const f = ph.files && ph.files[0]; if (f) handlePhoto(f); });
  const drop = $('#drop');
  if (drop) {
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => { const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) { if (!S.plus.active && S.photosUsed >= S.photosMax) return A.pickphoto(); handlePhoto(f); } });
  }
}
async function handlePhoto(f) {
  if (!/^image\//.test(f.type) && !/\.heic$/i.test(f.name)) { toast(t('Нужна фотография: JPG, PNG или HEIC', 'Needs a photo: JPG, PNG or HEIC'), { tone: 'r' }); return; }
  if (f.size > 15 * 1024 * 1024) { toast(t('Фото больше 15 МБ — сожми или сними заново', 'Photo is over 15 MB. Compress it or take a new one'), { tone: 'r' }); return; }
  if (needNet()) return;
  try { if (RT.photoURL) URL.revokeObjectURL(RT.photoURL); RT.photoURL = URL.createObjectURL(f); } catch (e) { RT.photoURL = null; }
  go('fridge', { stage: 'scan' }, { replace: true });
  let res = null;
  try {
    const img = await shrinkImage(f);
    const keys = Object.keys(ING).map(k => ({ k, name: ING[k].ru }));
    [res] = await Promise.all([api('fridge', { image: img, keys }, 30000), wait(1500)]);
  } catch (e) { res = null; }
  if (!(R.route === 'fridge' && R.p.stage === 'scan')) return;
  if (!res || !((res.found || []).length + (res.other || []).length)) {
    go('fridge', {}, { replace: true });
    toast(t('Не получилось разобрать фото — отметь продукты списком', 'Couldn’t read the photo. Mark your food from the list'), { tone: 'r', act: t('Списком', 'Use list'), fn: pickerSheet, ms: 6000 });
    return;
  }
  if (!S.plus.active) S.photosUsed++;
  photoFound(res.found || [], res.other || []);
}
async function shrinkImage(f, max = 1024) {
  const url = URL.createObjectURL(f);
  try {
    const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.8);
  } finally { URL.revokeObjectURL(url); }
}
